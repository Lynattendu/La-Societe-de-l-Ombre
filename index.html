<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Société de l'Ombre</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="intro">

    <div class="cover"></div>

    <div class="vignette"></div>

    <div class="crack"></div>

    <div class="particles" id="particles"></div>

    <div class="blackout"></div>

    <button class="skip" id="skipBtn">
      Passer l’introduction
    </button>

    <button class="sound" id="soundBtn">
      Son : désactivé
    </button>

    <section class="content">

      <div class="panel">

        <div class="symbol" aria-hidden="true">

          <svg viewBox="0 0 100 100">

            <defs>

              <linearGradient
                id="infinityGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >

                <stop offset="0%" stop-color="#4da6ff"></stop>

                <stop offset="50%" stop-color="#fff3c0"></stop>

                <stop offset="100%" stop-color="#f5c56a"></stop>

              </linearGradient>

            </defs>

            <path
              class="infinity-core"
              d="M18,50
                 C18,34 31,34 40,50
                 C50,66 58,66 68,50
                 C78,34 91,34 91,50
                 C91,66 78,66 68,50
                 C58,34 50,34 40,50
                 C31,66 18,66 18,50 Z">
            </path>

            <path
              class="infinity-stroke"
              d="M18,50
                 C18,34 31,34 40,50
                 C50,66 58,66 68,50
                 C78,34 91,34 91,50
                 C91,66 78,66 68,50
                 C58,34 50,34 40,50
                 C31,66 18,66 18,50 Z">
            </path>

          </svg>

        </div>

        <h1>
          La Société
          <br>
          <span class="light">
            de l’Ombre
          </span>
        </h1>

        <p class="tagline">
          Le plus grand secret de l’humanité n’est peut-être pas ce qu’elle a perdu…
          <br>
          mais ce qu’elle pourrait devenir.
        </p>

        <div class="actions">

          <button
            class="enter"
            id="enterBtn"
          >
            Entrer dans l’ombre
          </button>

          <a
            class="button"
            href="chapitre1.html"
          >
            Commencer directement
          </a>

        </div>

      </div>

    </section>

    <div
      class="flash"
      id="flash"
    ></div>

  </main>

  <script src="js/intro.js"></script>

</body>

</html>
