<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>
    La Société de l'Ombre — Chapitres
  </title>
<link rel="apple-touch-icon" href="images/Icone-app.PNG">
<link rel="icon" type="image/png" href="images/Icone-app.PNG">
  <link
    rel="stylesheet"
    href="css/menu.css"
  >

</head>


<body>


  <main class="menu-page">


    <!-- =====================================================
         FOND
    ====================================================== -->

    <div class="menu-overlay"></div>


    <!-- =====================================================
         CONTENU
    ====================================================== -->

    <section class="menu-content">


      <h1>
        La Société de l'Ombre
      </h1>


      <p class="menu-subtitle">
        Choisissez un chapitre
      </p>


      <p class="menu-help">
        Reprenez votre lecture
        ou recommencez le chapitre de votre choix.
      </p>


      <!-- ===================================================
           LISTE DES CHAPITRES
      ==================================================== -->

      <div
        class="chapters"
        id="chapters"
      ></div>


      <!-- ===================================================
           RETOUR À L'ACCUEIL GÉNÉRAL
      ==================================================== -->

      <a
        href="livre.html"
        class="back-btn"
      >
        Retour à l'accueil
      </a>


    </section>


  </main>


  <!-- =====================================================
       FENÊTRE
       REPRENDRE / RECOMMENCER
  ====================================================== -->

  <div
    class="chapter-modal hidden"
    id="chapterModal"
    aria-hidden="true"
  >


    <div
      class="modal-background"
      id="modalBackground"
    ></div>


    <div
      class="modal-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="selectedChapterTitle"
    >


      <p class="modal-small">
        Vous avez sélectionné
      </p>


      <h2
        id="selectedChapterTitle"
      >
        Chapitre
      </h2>


      <p class="modal-question">
        Que souhaitez-vous faire ?
      </p>


      <button
        class="modal-btn resume-btn"
        id="resumeBtn"
        type="button"
      >
        Reprendre la lecture
      </button>


      <button
        class="modal-btn restart-btn"
        id="restartBtn"
        type="button"
      >
        Recommencer le chapitre
      </button>


      <button
        class="cancel-btn"
        id="cancelBtn"
        type="button"
      >
        Annuler
      </button>


    </div>


  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="js/menu.js"></script>


</body>

</html>
